[workspace]
resolver = "2"
members = ["crates/ds4246-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/krifmaz/netcrapp"
rust-version = "1.80"

[workspace.dependencies]
ds4246-core = { path = "crates/ds4246-core" }
anyhow = "1"
thiserror = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
