# /etc/ds4246-web/config.toml  (chmod 600, owned by root)

# Your Proxmox host's LAN address. 0.0.0.0 / :: / public IPs are refused
# unless allow_non_lan = true.
bind = "192.168.1.10:8446"

# Generate with:  ds4246-web hash-password
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_ME$REPLACE_ME"

# Where "Save dump" writes <device>/<timestamp>/page_XX.{bin,txt}
dump_dir = "/var/lib/ds4246-web/dumps"

# Standard SES pages (0x01/0x02/0x07/0x0A) are re-read this often.
poll_secs = 10

# Drive temperature reads (LOG SENSE page 0x0D). 0 disables them.
drive_temp_secs = 300

session_hours = 12
allow_non_lan = false

# Temperature-driven fan requests (SES SEND DIAGNOSTIC, cooling elements only).
# Uses the hottest shelf sensor or drive. Steps: [°C, speed code 1-7].
# The IOM keeps its own minimum (code 1 ≈ 3100 rpm on a DS4246), so this can
# only make cooling more aggressive. Any over-temperature warning → code 7.
# Tested 2026-10-20: the FAS2554's embedded IOM6E accepts but IGNORES speed
# requests, so this has no effect there. Retest on plain IOM6.
[fan_curve]
enabled = false
points = [[0, 1], [40, 2], [45, 3], [50, 5], [55, 7]]
hysteresis_c = 3
